name: Mirror to yuvajyotish/yj_projectb

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    name: Push branches and tags to yuvajyotish/yj_projectb
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to target repository without deleting anything
        env:
          ACCOUNT_B_PAT: ${{ secrets.ACCOUNT_B_PAT }}
          TARGET_REPO: yuvajyotish/yj_projectb
        run: |
          set -euo pipefail

          if [ -z "${ACCOUNT_B_PAT}" ]; then
            echo "ERROR: ACCOUNT_B_PAT secret is missing."
            exit 1
          fi

          git remote add mirror "https://x-access-token:${ACCOUNT_B_PAT}@github.com/${TARGET_REPO}.git"

          echo "Fetching all branches and tags from source..."
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags

          echo "Pushing all branches to target repo..."
          for branch in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -v '^HEAD$'); do
            echo "Pushing branch: ${branch}"
            git push mirror "refs/remotes/origin/${branch}:refs/heads/${branch}"
          done

          echo "Pushing all tags to target repo..."
          git push mirror --tags

          echo "Mirror completed successfully."